name: release

# Releases whatever lands on main, as soon as the version in tauri.conf.json
# has no tag yet. Bump it with `pnpm bump` and merge; the rest is automatic.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A second push while a release is building would build the same version twice.
# Queuing them means the later run sees the tag and stops at the decide job.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev build-essential curl wget file libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc signature: without any signature an arm64 build downloaded
          # from the internet is reported as damaged instead of unidentified.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: v${{ needs.decide.outputs.version }}
          releaseName: "Claude Terminal v${{ needs.decide.outputs.version }}"
          releaseBody: |
            Qual arquivo baixar:
            - Mac com chip Apple (M1 ou mais novo): `macOS-Apple-Silicon.dmg`
            - Mac com processador Intel: `macOS-Intel.dmg`
            - Linux (qualquer distribuição): `Linux.AppImage`
            - Debian ou Ubuntu: `Linux-Debian-Ubuntu.deb`

            Os arquivos `_atualizacao` e `.sig` são usados pela atualização automática e não precisam ser baixados. O app se atualiza sozinho a partir daqui.
          releaseDraft: false
          prerelease: false
          # Composed once by the manifest job; parallel jobs overwrote each other.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  manifest:
    needs: [decide, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Give the assets readable names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.decide.outputs.version }}
        run: node .github/scripts/rename-assets.mjs
      - name: Compose the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.decide.outputs.version }}
        run: node .github/scripts/manifest.mjs
