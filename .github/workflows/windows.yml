name: windows

# Windows is built and smoke-tested here but kept out of releases until it
# has been tried on a real machine. The installer is attached to each run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      # Checks what can run without a person at the keyboard: hook mode, and
      # the app starting and answering on its local server.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/claude-terminal.exe"

          $context = '{}' | & $exe --hook session-start
          if ($context -notmatch 'SessionStart') { throw "hook mode printed: $context" }

          $app = Start-Process -FilePath $exe -PassThru
          $body = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          $tools = $null
          for ($i = 0; $i -lt 60 -and -not $tools; $i++) {
            Start-Sleep -Seconds 1
            try {
              $tools = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:47831/mcp" -Body $body -ContentType "application/json"
            } catch {}
          }
          if (-not $tools) { throw "the app never answered on port 47831" }
          $names = $tools.result.tools.name -join ", "
          Write-Host "MCP tools: $names"
          if ($names -notmatch 'suggest_command') { throw "unexpected tools: $names" }

          '{"hook_event_name":"Notification","message":"smoke"}' | & $exe --hook forward
          if ($LASTEXITCODE -ne 0) { throw "hook forward exited $LASTEXITCODE" }

          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: shellhive-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
